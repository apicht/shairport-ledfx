services:
  ledfx:
    image: ${LEDFX_IMAGE}
    container_name: ledfx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ledfx-config:/home/ledfx/ledfx-config:rw
      - ./volumes/ledfx-pulse:/home/ledfx/.config/pulse:rw
    healthcheck:
      test: ["CMD-SHELL", "test -S /home/ledfx/.config/pulse/pulseaudio.socket || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  shairport-config-render:
    image: ${RENDER_IMAGE}
    container_name: shairport-config-render
    command: ["bash", "/scripts/render-config.sh", "/out/shairport-sync.conf"]
    environment:
      AIRPLAY_NAME: ${AIRPLAY_NAME:?AIRPLAY_NAME required in .env}
      MQTT_ENABLED: ${MQTT_ENABLED:-yes}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-}
    volumes:
      - ./shairport-sync:/scripts:ro
      - shairport-config:/out
    restart: "no"

  shairport:
    image: ${SHAIRPORT_IMAGE}
    container_name: shairport
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_NICE          # nqptp scheduling priority
    depends_on:
      ledfx:
        condition: service_healthy
      shairport-config-render:
        condition: service_completed_successfully
    environment:
      PULSE_SERVER: "unix:/tmp/pulseaudio.socket"
      PULSE_COOKIE: "/tmp/cookie"
    volumes:
      - shairport-config:/cfg:ro
      - ./volumes/ledfx-pulse:/tmp:rw
    command: ["-c", "/cfg/shairport-sync.conf"]
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ledfx-config:
  shairport-config:
